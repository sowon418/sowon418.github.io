<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이소원 — Portfolio</title>
<meta name="description" content="이소원 · 컴퓨터비전 기반 주행 환경 인식과 문서 AI 연구·개발 포트폴리오">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#f7f7f5; --surface:#ffffff; --line:#e4e4df; --text:#18181b; --muted:#6b6b72;
  --accent:#0f9d76; --accent-soft:#0f9d7614; --grid:#00000010;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c0d0f; --surface:#141518; --line:#24262b; --text:#ececee; --muted:#8b8d95;
    --accent:#3ddc97; --accent-soft:#3ddc971a; --grid:#ffffff0d;
  }
}
:root[data-theme="dark"]{
  --bg:#0c0d0f; --surface:#141518; --line:#24262b; --text:#ececee; --muted:#8b8d95;
  --accent:#3ddc97; --accent-soft:#3ddc971a; --grid:#ffffff0d;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:Pretendard,system-ui,sans-serif;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
::selection{background:color-mix(in srgb,var(--accent) 30%,transparent);color:var(--text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
html{scrollbar-color:color-mix(in srgb,var(--muted) 45%,transparent) transparent}
.num,.when,.metric{font-variant-numeric:tabular-nums}
.ico{width:14px;height:14px;flex:none;vertical-align:-2px}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.skip{position:absolute;left:-999px}.skip:focus{left:12px;top:12px;background:var(--accent);color:#000;padding:6px 10px;z-index:99}

/* nav */
header{position:fixed;inset:0 0 auto;z-index:20;border-bottom:1px solid transparent;transition:background .3s,border-color .3s}
header.solid{backdrop-filter:blur(10px);background:color-mix(in srgb,var(--bg) 82%,transparent);border-bottom-color:var(--line)}
nav{display:flex;align-items:center;gap:20px;height:56px}
nav .logo{margin-right:auto;font-family:Archivo,sans-serif;font-stretch:125%;font-weight:750;font-size:17px;letter-spacing:-.01em}
nav a.link{font-size:14px;color:var(--muted)} nav a.link:hover{color:var(--text)}
#theme{display:grid;place-items:center;background:none;border:1px solid var(--line);color:var(--text);border-radius:8px;width:34px;height:34px;cursor:pointer}
#theme svg{width:16px;height:16px}
@media(max-width:640px){nav a.link{display:none}}

/* hero */
.hero{padding:0;border:0;position:relative;min-height:100svh;display:flex;align-items:flex-end;overflow:hidden;isolation:isolate}
#sim{position:absolute;inset:0;width:100%;height:100%;z-index:-2;cursor:pointer;display:block}
.hero-fade{position:absolute;inset:0;z-index:-1;pointer-events:none;background:
  linear-gradient(180deg,color-mix(in srgb,var(--bg) 70%,transparent) 0,transparent 140px),
  linear-gradient(0deg,var(--bg) 0,transparent 26%),
  linear-gradient(90deg,var(--bg) 0,color-mix(in srgb,var(--bg) 88%,transparent) 28%,color-mix(in srgb,var(--bg) 35%,transparent) 50%,transparent 68%)}
.hero-inner{width:100%;padding-top:120px;padding-bottom:72px;pointer-events:none}
.hero-copy{max-width:640px}
.hero-copy .socials,.hud{pointer-events:auto}
.hero-name{font-family:Archivo,sans-serif;font-stretch:125%;font-weight:800;font-size:clamp(68px,11.5vw,176px);line-height:.88;letter-spacing:-.035em;margin:0 0 28px}
.hero-line{font-size:clamp(20px,2.1vw,26px);font-weight:600;letter-spacing:-.015em;margin-bottom:12px}
.hero p.bio{color:var(--muted);font-size:16px;max-width:54ch}
.socials{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
.socials a{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:999px;font-size:14px;transition:.2s}
.socials a:hover{border-color:var(--accent);color:var(--accent)}
.socials svg{width:16px;height:16px}

/* floating HUD */
.hud{position:absolute;top:84px;right:max(20px,calc((100vw - 1040px)/2 + 20px));width:290px;font-size:12px;
  background:color-mix(in srgb,var(--surface) 72%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid color-mix(in srgb,var(--line) 80%,transparent);border-radius:10px;padding:12px 14px}
.stages{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:10px}
.stages button{font:inherit;font-size:12px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:none;border:1px solid transparent;color:var(--muted);padding:4px 7px;border-radius:6px;cursor:pointer;transition:color .2s,background .2s}
.stages button:hover{color:var(--text)}
.stages button.on{color:var(--accent);background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.hud dl{display:grid;grid-template-columns:72px 1fr;row-gap:3px;margin:0}
.hud dt{color:var(--muted)} .hud dd{margin:0;color:var(--text)} .hud dd#s-stage{color:var(--accent)}
@media(max-width:860px){
  .hero-fade{background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 70%,transparent) 0,transparent 120px),
    linear-gradient(0deg,var(--bg) 0,color-mix(in srgb,var(--bg) 88%,transparent) 48%,transparent 78%)}
  .hud{top:68px;left:20px;right:20px;width:auto;padding:8px}
  .stages{grid-template-columns:repeat(4,1fr);margin:0}
  .stages button{text-align:center;padding:4px 2px;font-size:12px}
  .hud dl{display:none}
}

/* sections */
section{border-top:1px solid var(--line)}
section{padding:88px 0}
.sec-head{margin-bottom:32px}
.sec-head h2,.contact h2{font-family:Archivo,Pretendard,sans-serif;font-stretch:125%;font-weight:750;font-size:clamp(28px,3.4vw,40px);line-height:1.05;letter-spacing:-.03em}

.tags{margin-top:14px;font-size:13px;line-height:1.6;color:var(--muted)}
.tags span+span::before{content:"·";margin:0 .45em;opacity:.6}

/* timeline */
.tl{display:grid;gap:14px}
.tl-item{display:grid;grid-template-columns:170px 1fr;gap:24px;padding:22px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
@media(max-width:640px){.tl-item{grid-template-columns:1fr;gap:6px}}
.tl-item .when{font-size:13px;color:var(--muted)}
.tl-item h3{font-size:18px}.tl-item h3 small{font-weight:400;color:var(--muted);font-size:14px;margin-left:6px}
.tl-item ul{margin:10px 0 0 18px;color:var(--muted);font-size:15px}
.metric{margin-top:12px;font-size:14px;color:var(--muted)}
.metric .from{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent)}
.metric b{color:var(--text);font-weight:700;margin-left:.2em}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;transition:border-color .2s}
.card:hover{border-color:color-mix(in srgb,var(--text) 28%,var(--line))}
.card h3{font-size:17px;line-height:1.4;margin:2px 0 6px;text-wrap:balance}
.card p{font-size:14px;color:var(--muted);flex:1}
.links{display:flex;gap:16px;margin-top:14px;font-size:14px;font-weight:500}
.links:empty{display:none}
.links a{display:inline-flex;align-items:center;gap:4px;color:var(--text);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px;transition:text-decoration-color .2s}
.links a:hover{text-decoration-color:var(--accent)}
.thumb{aspect-ratio:16/9;border-radius:8px;object-fit:cover;background:var(--line)}

.badge{font-size:13px;font-weight:500;color:var(--text);margin:0 0 8px;opacity:.85}
.card .metric{align-self:flex-start}

/* activities gallery */
.row.act{display:block;cursor:default}
.act.has-img:hover h3,.act.has-img:focus-within h3,.act.open h3{color:var(--accent)}
.act-main{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.gallery{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s cubic-bezier(.2,.7,.2,1)}
.act:hover .gallery,.act:focus-within .gallery,.act.open .gallery{grid-template-rows:1fr}
.gallery-inner{overflow:hidden;min-height:0}
.strip{display:flex;gap:10px;padding-top:14px;overflow-x:auto;scroll-snap-type:x mandatory}
.strip img{flex:none;height:200px;width:auto;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:zoom-in;scroll-snap-align:start;
  opacity:0;transform:translateX(-16px);transition:opacity .35s,transform .35s;transition-delay:calc(var(--i) * 70ms)}
.act:hover .strip>*,.act:focus-within .strip>*,.act.open .strip>*{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.gallery,.strip>*{transition:none}}

.cam{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:400;color:var(--muted);margin-left:8px;vertical-align:2px;white-space:nowrap}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.82);display:grid;place-items:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .25s;cursor:zoom-out}
.lightbox.on{opacity:1;pointer-events:auto}
.lightbox figure{display:flex;flex-direction:column;align-items:center;gap:12px;max-width:min(1100px,100%);max-height:100%}
.lightbox img{max-width:100%;max-height:calc(100svh - 110px);object-fit:contain;border-radius:6px;background:#fff;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.lightbox figcaption{color:#e8e8ea;font-size:13px;text-align:center}
.lightbox .nav{display:none;place-items:center;position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;cursor:pointer}
.lightbox .nav svg{width:20px;height:20px;pointer-events:none}
.lightbox .nav:hover{background:rgba(255,255,255,.26)}
.lightbox.multi .nav{display:grid}
.lightbox .prev{left:16px}.lightbox .next{right:16px}
.thumb-btn{position:relative;display:block;border:0;padding:0;background:none;cursor:zoom-in;margin:-6px -6px 14px;width:calc(100% + 12px)}
.thumb-btn .thumb{margin:0;width:100%;display:block}
.thumb-btn .count{position:absolute;right:8px;bottom:8px;display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#fff;background:rgba(10,12,14,.72);padding:3px 9px;border-radius:999px}

.proj-preview{position:fixed;z-index:30;margin:0;pointer-events:none;opacity:0;transform:translateY(6px) scale(.97);transform-origin:center;
  transition:opacity .2s ease,transform .25s cubic-bezier(.2,.7,.2,1);background:var(--surface);border-radius:12px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.24)}
.proj-preview.on{opacity:1;transform:none}
.proj-preview img{display:block;width:100%;height:auto;max-height:68vh;object-fit:contain;background:#fff}
.proj-preview figcaption{font-size:12px;color:var(--muted);padding:8px 12px;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){.proj-preview{transition:none}}

/* list */
.list{display:grid;gap:10px}
.list{gap:0;border-top:1px solid var(--line)}
.row{display:flex;justify-content:space-between;gap:16px;padding:18px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row h3{font-size:16px;line-height:1.45;transition:color .2s}.row p{font-size:14px;color:var(--muted);margin-top:2px}
.row .when{font-size:13px;color:var(--muted);white-space:nowrap}

/* contact */
.contact{text-align:center;padding:80px 0}
.contact h2{font-size:clamp(28px,4vw,40px);letter-spacing:-.02em;margin-bottom:26px}
.contact p{color:var(--muted);margin:10px 0 26px}
.btn{display:inline-block;background:var(--accent);color:#06140e;font-weight:600;padding:12px 22px;border-radius:10px}
footer{border-top:1px solid var(--line);padding:24px 0;font-size:13px;color:var(--muted)}

@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>

</div>

$("#proj").addEventListener("click", e => {
  const b = e.target.closest(".thumb-btn"); if (!b) return;

/* hover preview: enlarged image beside the card, only where it won't cover the card */
const pv = document.createElement("figure"); pv.className = "proj-preview";
pv.innerHTML = '<img alt=""><figcaption></figcaption>'; document.body.append(pv);
let pvCard = null;
function placePreview(card){
  const r = card.getBoundingClientRect(), gap = 16, vw = innerWidth, vh = innerHeight;
  const right = vw - r.right - gap * 2, left = r.left - gap * 2;
  const room = Math.max(right, left), w = Math.min(560, room);
  if (w < 260) { pv.classList.remove("on"); return false; }
  pv.style.width = w + "px";
  pv.style.left = (right >= left ? r.right + gap : r.left - gap - w) + "px";
  const h = pv.offsetHeight || w * .6;
  pv.style.top = Math.max(72, Math.min(r.top, vh - h - 16)) + "px";
  return true;
}
$("#proj").addEventListener("mouseover", e => {
  if (!matchMedia("(hover: hover)").matches) return;
  const card = e.target.closest(".card"); if (!card || card === pvCard) return;
  const btn = card.querySelector(".thumb-btn"); if (!btn) { pv.classList.remove("on"); pvCard = null; return; }
  const p = DATA.projects[+btn.dataset.p]; pvCard = card;
  const img = pv.querySelector("img"); img.src = p.img; img.alt = p.title;
  const n = (p.images || [p.img]).length;
  pv.querySelector("figcaption").textContent = (p.captions && p.captions[0] ? p.captions[0] + " · " : "") + (n > 1 ? `이미지 ${n}장 · 클릭해서 전체 보기` : "클릭해서 크게 보기");
  if (placePreview(card)) { img.onload = () => pvCard === card && placePreview(card); pv.classList.add("on"); }
});
$("#proj").addEventListener("mouseleave", () => { pv.classList.remove("on"); pvCard = null; });
$("#proj").addEventListener("mouseout", e => { if (pvCard && !pvCard.contains(e.relatedTarget)) { pv.classList.remove("on"); pvCard = null; } });
addEventListener("scroll", () => { if (pvCard) placePreview(pvCard); }, { passive: true });
renderProjects();

const renderList = arr => arr.map(a=>{
  const has = a.images && a.images.length;
  const imgs = has ? a.images.map((src,i)=>`<img src="${esc(src)}" alt="${esc(a.title)} 사진 ${i+1}" loading="lazy" style="--i:${i}">`).join("") : "";
  return `<div class="row act${has?" has-img":""}"${has?' tabindex="0"':""}>
    <div class="act-main"><div><h3>${esc(a.title)}${has?`<span class="cam">${I.img}${a.images.length}<span class="skip">장의 사진</span></span>`:""}</h3><p>${esc(a.desc)}</p></div><div class="when">${esc(a.when)}</div></div>
    ${has?`<div class="gallery"><div class="gallery-inner"><div class="strip">${imgs}</div></div></div>`:""}
  </div>`;}).join("");
const lb = document.createElement("div"); lb.className = "lightbox";
lb.innerHTML = `<figure><img alt=""><figcaption></figcaption></figure><button class="nav prev" aria-label="이전 이미지">${I.prev}</button><button class="nav next" aria-label="다음 이미지">${I.next}</button>`;
document.body.append(lb);
let lbList = [], lbIdx = 0, lbTitle = "", lbCaps = null;
function showLb(){
  const img = lb.querySelector("img"); img.src = lbList[lbIdx]; img.alt = `${lbTitle} ${lbIdx+1}`;
  const cap = (lbCaps && lbCaps[lbIdx]) || "";
  lb.querySelector("figcaption").textContent = lbList.length > 1 ? `${lbIdx+1} / ${lbList.length}${cap ? " · " + cap : ""}` : cap;
  lb.classList.toggle("multi", lbList.length > 1);
}
function openLightbox(list, idx, title, caps){ lbList = list; lbIdx = idx; lbTitle = title; lbCaps = caps || null; showLb(); lb.classList.add("on"); }
const stepLb = d => { lbIdx = (lbIdx + d + lbList.length) % lbList.length; showLb(); };
lb.addEventListener("click", e => {
  if (e.target.classList.contains("prev")) return stepLb(-1);
  if (e.target.classList.contains("next")) return stepLb(1);
  lb.classList.remove("on");
});
addEventListener("keydown", e => {
  if (!lb.classList.contains("on")) return;
  if (e.key === "Escape") lb.classList.remove("on");
  if (e.key === "ArrowLeft") stepLb(-1);
  if (e.key === "ArrowRight") stepLb(1);
});

/* ===== zero-shot drivable-area detection · driver's view ===== */
(() => {
  const cv = $("#sim"), ctx = cv.getContext("2d");
  let W = 640, H = 480, HZ = 200, K = 350, X0 = 320, dpr = 1;
  function resize() {
    const r = cv.getBoundingClientRect(); dpr = Math.min(devicePixelRatio || 1, 1.5);
    W = Math.max(320, r.width); H = Math.max(320, r.height);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    HZ = Math.round(H * .42); K = .55 * Math.min(W, H * 1.333); X0 = W > 860 ? W * .66 : W * .5;
  }
  resize(); addEventListener("resize", resize);
  let onScreen = true; new IntersectionObserver(([e]) => onScreen = e.isIntersecting).observe(cv);
  const css = v => getComputedStyle(root).getPropertyValue(v).trim();
  const STAGES = [
    { k: "RGB",      n: "01 RGB",      t: 2600 },
    { k: "DEPTH",    n: "02 Depth",    t: 3200 },
    { k: "SEGMENT",  n: "03 SAM 2",    t: 2600 },
    { k: "DRIVABLE", n: "04 Drivable", t: 6000 },
  ];
  let stage = 0, lastPick = -1e9, stageAt = 0;
  const chips = $("#stages");
  chips.innerHTML = STAGES.map((s, i) => `<button role="tab" data-i="${i}">${s.n}</button>`).join("");
  const setStage = (i, user) => {
    stage = i; stageAt = performance.now(); if (user) lastPick = stageAt;
    chips.querySelectorAll("button").forEach((b, j) => { b.classList.toggle("on", j === i); b.setAttribute("aria-selected", j === i); });
  };
  chips.addEventListener("click", e => { const i = e.target.dataset?.i; if (i !== undefined) setStage(+i, true); });
  cv.addEventListener("click", () => setStage((stage + 1) % STAGES.length, true));
  setStage(3);

  let probe = null;
  cv.addEventListener("pointermove", e => {
    const b = cv.getBoundingClientRect();
    probe = { x: e.clientX - b.left, y: e.clientY - b.top };
  });
  cv.addEventListener("pointerleave", () => probe = null);

  /* ---------- world ---------- */
  const c  = s => 2.4 * Math.sin(s * .019) + 1.3 * Math.sin(s * .047 + 1);   // path centre (m)
  const w  = s => 1.8 + .5 * Math.sin(s * .033 + 2);                           // half width (m)
  const nL = s => .22 * Math.sin(s * .9) + .14 * Math.sin(s * 2.7 + 1);
  const nR = s => .22 * Math.sin(s * .8 + 3) + .14 * Math.sin(s * 2.3);
  const R = (a, b) => a + Math.random() * (b - a);
  const hash = n => { n = Math.sin(n * 127.1) * 43758.5453; return n - Math.floor(n); };
  const segCol = (id, l = 56) => `hsl(${Math.floor(hash(id) * 360)},42%,${l}%)`;
  const ramp = v => {
    v = Math.max(0, Math.min(1, v));
    const st = [[13, 2, 33], [184, 61, 74], [246, 213, 92]], t = v * 2, i = Math.min(1, Math.floor(t)), f = t - i, a = st[i], b = st[i + 1];
    return `rgb(${a.map((x, j) => Math.round(x + (b[j] - x) * f)).join(",")})`;
  };
  const depthCol = dz => ramp(1 - dz / 55);
  const FOG = [230, 236, 230];
  const fogT = dz => Math.min(.78, dz / 65);
  const tint = (col, dz, k = 1) => `rgb(${col.map((v, i) => Math.round(Math.min(255, v * k) + (FOG[i] - Math.min(255, v * k)) * fogT(dz))).join(",")})`;

  let pos = 0, camX = c(6), speed = 8;
  const px = (X, dz) => X0 + (X - camX) / dz * K;
  const rowY = dz => HZ + 3 / dz * (H - HZ);
  const dzAt = y => 3 / ((y - HZ) / (H - HZ));

  const rocks = [], trees = [], pebbles = [];
  let nR_ = 10, nT = 2, nP = 2;
  function spawn() {
    const far = pos + 85;
    while (nR_ < far) {                                // rocks: dense, mostly small, some large
      const s = nR_, on = Math.random() < .68, r = on ? .14 + Math.random() ** 2 * .6 : R(.2, .9);
      const X = on ? c(s) + R(-.85, .85) * w(s) : c(s) + (Math.random() < .5 ? -1 : 1) * (w(s) + R(.3, 3.5));
      const g = R(100, 140);
      rocks.push({ s, X, r, on: on && r > .22, id: Math.random() * 1e3, col: [g, g - R(4, 12), g - R(10, 22)],
                   v: Array.from({ length: 9 }, () => R(.78, 1.08)) });
      nR_ += R(3.5, 9);
    }
    while (nT < far) {                                 // trees on both verges
      const s = nT, side = Math.random() < .5 ? -1 : 1;
      trees.push({ s, X: c(s) + side * (w(s) + R(2, 8)), h: R(3.5, 7.5), conifer: Math.random() < .6, id: Math.random() * 1e3,
                   leaf: [R(40, 62), R(72, 96), R(40, 54)] });
      nT += R(1.6, 4.5);
    }
    while (nP < far) {                                 // gravel
      const s = nP, g = R(95, 175);
      pebbles.push({ s, X: c(s) + R(-1.05, 1.05) * w(s), r: R(.025, .09), col: [g, g - 8, g - 18] });
      nP += .07;
    }
  }
  const cull = arr => { while (arr.length && arr[0].s < pos + 2) arr.shift(); };

  // lateral plan: move toward the wider gap around each blocking rock
  const plan = s => {
    let num = 0, den = 0;
    for (const b of rocks) {
      if (!b.on) continue;
      const wt = Math.exp(-(((s - b.s) / 4.5) ** 2)); if (wt < .01) continue;
      const lo = c(b.s) - w(b.s), hi = c(b.s) + w(b.s);
      const target = (b.X - b.r - lo) > (hi - b.X - b.r) ? (lo + b.X - b.r) / 2 : (b.X + b.r + hi) / 2;
      num += wt * (target - c(s)); den += wt;
    }
    return num / Math.max(1, den);
  };

  /* ---------- drawing helpers ---------- */
  function drawRock(b, mode) {
    const dz = b.s - pos, x = px(b.X, dz), y = rowY(dz), r = b.r / dz * K;
    if (r < .6) return;
    const shape = (pad = 0) => {
      ctx.beginPath();
      b.v.forEach((k, i) => {
        const a = Math.PI + i / (b.v.length - 1) * Math.PI;          // upper half, flat base
        const xx = x + Math.cos(a) * (r * k + pad), yy = y + Math.sin(a) * (r * .85 * k + pad);
        i ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy);
      });
      ctx.closePath();
    };
    if (mode === "RGB" || mode === "DRIVABLE") {
      ctx.fillStyle = `rgba(30,24,18,${.28 * (1 - fogT(dz))})`;
      ctx.beginPath(); ctx.ellipse(x + r * .15, y, r * 1.1, r * .22, 0, 0, 7); ctx.fill();
      ctx.fillStyle = tint(b.col, dz); shape(); ctx.fill();
      ctx.fillStyle = tint(b.col, dz, 1.28); ctx.beginPath(); ctx.ellipse(x - r * .25, y - r * .55, r * .45, r * .25, -.3, 0, 7); ctx.fill();
    } else if (mode === "DEPTH") { ctx.fillStyle = depthCol(dz - .3); shape(); ctx.fill(); }
    else { ctx.fillStyle = segCol(b.id, 50); shape(); ctx.fill(); ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.2; ctx.stroke(); }
    if (mode === "DRIVABLE" && b.on) {
      shape(4); ctx.fillStyle = "rgba(255,80,80,.25)"; ctx.fill(); ctx.strokeStyle = "#ff5d5d"; ctx.lineWidth = 2; ctx.stroke();
    }
  }
  function drawTree(t, mode) {
    const dz = t.s - pos, x = px(t.X, dz), y = rowY(dz), u = K / dz, h = t.h * u;
    if (u * .2 < .5) return;
    const trunkC = mode === "DEPTH" ? depthCol(dz) : mode === "SEGMENT" ? segCol(t.id + .3, 40) : tint([88, 66, 48], dz);
    const leafC  = mode === "DEPTH" ? depthCol(dz - .5) : mode === "SEGMENT" ? segCol(t.id, 52) : tint(t.leaf, dz);
    const leafHi = mode === "RGB" || mode === "DRIVABLE" ? tint(t.leaf, dz, 1.22) : leafC;
    ctx.fillStyle = trunkC; ctx.fillRect(x - .12 * u, y - h * .45, .24 * u, h * .45);
    ctx.fillStyle = leafC;
    if (t.conifer) {
      for (let i = 0; i < 3; i++) {
        const top = y - h * (1 - i * .2), base = y - h * (.28 - i * .02) - i * h * .14, half = (1.3 - i * .3) * u;
        ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x - half, base); ctx.lineTo(x + half, base); ctx.fill();
      }
    } else {
      [[0, .78, .95], [-.6, .62, .7], [.6, .62, .7], [0, .5, .8]].forEach(([ox, oy, rr]) => {
        ctx.beginPath(); ctx.arc(x + ox * u, y - h * oy, rr * u * 1.1, 0, 7); ctx.fill();
      });
      ctx.fillStyle = leafHi; ctx.beginPath(); ctx.arc(x - .35 * u, y - h * .85, .45 * u, 0, 7); ctx.fill();
    }
  }
  function tag(text, x, y, bg = "rgba(10,12,14,.72)", fg = "#fff") {
    ctx.font = "600 11px 'JetBrains Mono', monospace";
    const tw = ctx.measureText(text).width + 10;
    x = Math.max(2, Math.min(W - tw - 2, x));
    ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(x, y - 9, tw, 18, 4); ctx.fill();
    ctx.fillStyle = fg; ctx.textBaseline = "middle"; ctx.fillText(text, x + 5, y);
  }

  /* ---------- loop ---------- */
  let prev = performance.now();
  function frame(now) {
    const dt = Math.min(.05, (now - prev) / 1000); prev = now;
    if (!onScreen) { requestAnimationFrame(frame); return; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (now - lastPick > 9000 && now - stageAt > STAGES[stage].t) setStage((stage + 1) % STAGES.length, false);

    spawn(); cull(rocks); cull(trees); cull(pebbles);
    const blocking = rocks.filter(b => b.on && b.s - pos > 2);
    const near = blocking.length ? blocking[0].s - pos : null;
    speed += ((near !== null && near < 16 ? 5 : 8.5) - speed) * dt * 1.5;
    pos += speed * dt;
    const look = pos + 6;
    camX += (c(look) + plan(look) - camX) * dt * 2.4;

    const mode = STAGES[stage].k, acc = css("--accent"), photo = mode === "RGB" || mode === "DRIVABLE";

    // sky + far hills
    if (photo) {
      const g = ctx.createLinearGradient(0, 0, 0, HZ); g.addColorStop(0, "#a7c6d8"); g.addColorStop(1, "rgb(230,236,230)");
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, HZ);
      ctx.fillStyle = "#9db0a1"; ctx.beginPath(); ctx.moveTo(0, HZ);
      for (let x = 0; x <= W; x += 12) ctx.lineTo(x, HZ - 22 - 14 * Math.sin(x * .012 - camX * .05) - 8 * Math.sin(x * .031 + 1));
      ctx.lineTo(W, HZ); ctx.fill();
    } else { ctx.fillStyle = mode === "DEPTH" ? ramp(0) : "hsl(205,40%,72%)"; ctx.fillRect(0, 0, W, HZ); }

    // ground scanlines
    let drv = 0, tot = 0, prevK = null;
    for (let y = HZ; y < H; y += 2) {
      const dz = dzAt(y + 1), s = pos + dz, cs = c(s), ws = w(s);
      const xl = px(cs - ws + nL(s), dz), xr = px(cs + ws + nR(s), dz);
      const band = Math.floor(s / 1.3) % 2, k = Math.floor(s / 14);
      if (mode === "DEPTH") { ctx.fillStyle = depthCol(dz); ctx.fillRect(0, y, W, 2); }
      else if (mode === "SEGMENT") {
        ctx.fillStyle = "hsl(95,38%,52%)";  ctx.fillRect(0, y, xl, 2);        // left terrain mask
        ctx.fillStyle = "hsl(150,34%,50%)"; ctx.fillRect(xr, y, W - xr, 2);    // right terrain mask
        ctx.fillStyle = "hsl(32,55%,60%)";  ctx.fillRect(xl, y, xr - xl, 2);   // path mask
        ctx.fillStyle = "#fff"; ctx.fillRect(xl - 1, y, 2, 2); ctx.fillRect(xr - 1, y, 2, 2);
      } else {
        const grass = band ? [84, 104, 58] : [92, 112, 63], dirt = band ? [146, 114, 80] : [154, 121, 86];
        const verge = [120, 108, 72], rut = [118, 90, 62];
        ctx.fillStyle = tint(grass, dz); ctx.fillRect(0, y, W, 2);
        const vw = .35 / dz * K;
        ctx.fillStyle = tint(verge, dz); ctx.fillRect(xl - vw, y, xr - xl + vw * 2, 2);
        ctx.fillStyle = tint(dirt, dz); ctx.fillRect(xl, y, xr - xl, 2);
        ctx.fillStyle = tint(rut, dz);
        for (const o of [-.75, .75]) { const rx = px(cs + o, dz), rw = .32 / dz * K; ctx.fillRect(rx - rw / 2, y, rw, 2); }
      }
      if (mode === "DRIVABLE") {
        ctx.fillStyle = "rgba(0,0,0,.28)"; ctx.fillRect(0, y, Math.max(0, xl), 2); ctx.fillRect(xr, y, W - xr, 2);
        ctx.globalAlpha = .36; ctx.fillStyle = acc; ctx.fillRect(xl, y, xr - xl, 2); ctx.globalAlpha = 1;
        ctx.fillStyle = acc; ctx.fillRect(xl - 1.5, y, 3, 2); ctx.fillRect(xr - 1.5, y, 3, 2);
      }
      prevK = k;
      drv += Math.max(0, Math.min(W, xr) - Math.max(0, xl)); tot += W;
    }

    // gravel (not segmented by SAM — too small)
    if (mode !== "SEGMENT") {
      for (let i = pebbles.length - 1; i >= 0; i--) {
        const p = pebbles[i], dz = p.s - pos; if (dz < 2.6 || dz > 40) continue;
        const r = p.r / dz * K; if (r < .5) continue;
        ctx.fillStyle = mode === "DEPTH" ? depthCol(dz - .1) : tint(p.col, dz);
        ctx.beginPath(); ctx.ellipse(px(p.X, dz), rowY(dz), r, r * .6, 0, 0, 7); ctx.fill();
      }
    }

    // rocks + trees, far to near
    const objs = [...rocks.map(o => ({ o, t: 0 })), ...trees.map(o => ({ o, t: 1 }))]
      .filter(e => e.o.s - pos > 2.4 && e.o.s - pos < 80).sort((a, b) => b.o.s - a.o.s);
    for (const e of objs) e.t ? drawTree(e.o, mode) : drawRock(e.o, mode);

    // depth read-outs
    if (mode === "DRIVABLE" || mode === "DEPTH") {
      for (const d of [5, 10, 20, 30]) {
        const y = rowY(d), s = pos + d, xl = px(c(s) - w(s), d), xr = px(c(s) + w(s), d);
        ctx.strokeStyle = mode === "DEPTH" ? "rgba(255,255,255,.55)" : acc; ctx.lineWidth = 1; ctx.setLineDash([3, 4]);
        ctx.beginPath(); ctx.moveTo(xl, y); ctx.lineTo(xr, y); ctx.stroke(); ctx.setLineDash([]);
        tag(`${d} m`, xr + 6, y, "rgba(10,12,14,.55)");
      }
    }
    if (mode === "DRIVABLE") {
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 3; ctx.setLineDash([10, 8]); ctx.lineDashOffset = -pos * 20; ctx.beginPath();
      let first = true;
      for (let dz = 3.2; dz < 45; dz *= 1.07) {
        const s = pos + dz, x = px(c(s) + plan(s), dz), y = rowY(dz);
        first ? ctx.moveTo(x, y) : ctx.lineTo(x, y); first = false;
      }
      ctx.stroke(); ctx.setLineDash([]);
      for (const b of blocking) {
        const dz = b.s - pos; if (dz > 35) break;
        const r = b.r / dz * K;
        tag(`${dz.toFixed(1)} m`, px(b.X, dz) - 22, rowY(dz) - r * 1.0 - 14, "rgba(200,40,40,.85)");
      }
    }

    // pointer depth probe
    if (probe && probe.y > HZ + 4) {
      const dz = dzAt(probe.y);
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(probe.x - 9, probe.y); ctx.lineTo(probe.x + 9, probe.y); ctx.moveTo(probe.x, probe.y - 9); ctx.lineTo(probe.x, probe.y + 9); ctx.stroke();
      tag(`depth ${dz.toFixed(1)} m`, probe.x + 12, probe.y - 14, acc, "#06140e");
    }

    // ego hood
    ctx.fillStyle = "rgba(14,15,17,.94)"; ctx.beginPath();
    const hw = Math.min(W, H * 1.333) * .4; ctx.moveTo(X0 - hw, H); ctx.quadraticCurveTo(X0, H - 52, X0 + hw, H); ctx.fill();

    $("#s-stage").textContent = mode;
    $("#s-speed").textContent = `${(speed * 3.6).toFixed(0)} km/h`;
    $("#s-drv").textContent = `${Math.round(drv / tot * 100)}%`;
    $("#s-near").textContent = near !== null ? `${near.toFixed(1)} m` : "—";
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
